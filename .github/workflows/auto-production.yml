name: Auto Production

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Images to generate in this run"
        required: false
        default: "5"

permissions:
  id-token: write
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger AI Girl Generator production
        env:
          TARGET: ${{ github.event.inputs.target || '5' }}
          OIDC_AUDIENCE: hkkeke-auto-production
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "GitHub OIDC is not available"
            exit 1
          fi

          TOKEN_RESPONSE="$(curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"

          OIDC_TOKEN="$(node -e "const input = JSON.parse(process.argv[1]); console.log(input.value)" "$TOKEN_RESPONSE")"

          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://hkkeke.vercel.app/api/auto-production?target=$TARGET"
