<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>角色一致性圖片工廠</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-panel">
        <header class="brand-block">
          <p class="eyebrow">Local AI Image Factory</p>
          <h1>人物庫 + 姿勢圖生成器</h1>
          <p class="lede">本機單人版。API key 只會存在你呢部機嘅瀏覽器。</p>
        </header>

        <section class="panel-section">
          <div class="section-title">
            <span>人物卡</span>
            <button class="icon-button" id="clearCharacter" type="button" title="重設人物卡">重設</button>
          </div>

          <label class="upload-box" for="referenceUpload">
            <input id="referenceUpload" type="file" accept="image/png,image/jpeg,image/webp">
            <span id="uploadHint">上傳人物參考圖</span>
            <img id="referencePreview" alt="人物參考預覽">
          </label>

          <label>
            角色 ID
            <input id="characterId" type="text" placeholder="girl-hk-001" autocomplete="off">
          </label>

          <label>
            角色描述
            <textarea id="characterDescription" rows="4" placeholder="香港女生，長髮，五官甜美，身材比例自然，固定面部特徵"></textarea>
          </label>

          <label>
            一致性要求
            <textarea id="consistencyNotes" rows="3" placeholder="same face, same identity, consistent body proportion, natural skin texture"></textarea>
          </label>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>OpenAI 設定</span>
            <button class="icon-button" id="clearSettings" type="button" title="清除設定">清除</button>
          </div>

          <label>
            API key
            <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off">
          </label>

          <div class="settings-grid">
            <label>
              模型
              <select id="modelSelect">
                <option value="gpt-image-1.5">gpt-image-1.5</option>
                <option value="gpt-image-1">gpt-image-1</option>
                <option value="gpt-image-1-mini">gpt-image-1-mini</option>
              </select>
            </label>
            <label>
              質素
              <select id="qualitySelect">
                <option value="medium">medium</option>
                <option value="low">low</option>
                <option value="high">high</option>
                <option value="auto">auto</option>
              </select>
            </label>
          </div>

          <div class="settings-grid">
            <label>
              尺寸
              <select id="sizeSelect">
                <option value="1024x1024">1024x1024</option>
                <option value="1024x1536">1024x1536</option>
                <option value="1536x1024">1536x1024</option>
                <option value="auto">auto</option>
              </select>
            </label>
            <label>
              張數
              <select id="countSelect">
                <option value="6">6 格</option>
                <option value="1">1 張</option>
                <option value="9">9 格</option>
              </select>
            </label>
          </div>

          <label class="check-row">
            <input id="adultConfirm" type="checkbox">
            <span>我確認所有參考人物均為 18+，並只生成非露骨、非深偽冒充、成人時尚用途內容。</span>
          </label>

          <p class="note">本工具係本機私用版，不適合直接公開部署。OpenAI 組織驗證、模型權限、瀏覽器 CORS 或網絡限制都可能影響生圖。</p>
        </section>
      </aside>

      <main class="workspace">
        <section class="control-strip">
          <label>
            場景
            <select id="sceneSelect"></select>
          </label>
          <label>
            衣服
            <select id="outfitSelect"></select>
          </label>
          <label>
            情緒
            <select id="moodSelect"></select>
          </label>
          <label>
            拍攝風格
            <select id="styleSelect"></select>
          </label>
        </section>

        <section class="action-bar">
          <div>
            <strong id="runStatus">待生成</strong>
            <span id="runMeta">先上傳參考圖、輸入 API key，再開始。</span>
          </div>
          <div class="button-row">
            <button id="randomizePose" type="button">隨機姿勢</button>
            <button id="demoGenerate" type="button">Demo 生成</button>
            <button id="generateImages" type="button" class="primary-button">生成圖片</button>
          </div>
          <div class="progress-track" aria-label="生成進度">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="preflight-list" id="preflightList" aria-label="工作台檢查"></div>
        </section>

        <section class="generator-grid">
          <div class="tool-area">
            <div class="section-title">
              <span>姿勢隊列</span>
              <span class="mini-stat" id="poseCountLabel">6 格</span>
            </div>
            <div class="pose-grid" id="poseGrid"></div>
          </div>

          <div class="tool-area">
            <div class="tabs">
              <button class="tab-button active" type="button" data-tab="prompt">Prompt</button>
              <button class="tab-button" type="button" data-tab="caption">Caption</button>
              <button class="tab-button" type="button" data-tab="guardrails">安全線</button>
            </div>
            <div class="tab-panel active" id="promptPanel">
            <div class="section-title compact">
              <span>Prompt 輸出</span>
              <div class="button-row">
                <button id="copyPosePrompts" type="button">複製逐張</button>
                <button id="copyPrompt" type="button">複製全部</button>
              </div>
            </div>
              <textarea id="promptOutput" class="prompt-output" rows="18" readonly></textarea>
            </div>
            <div class="tab-panel" id="captionPanel">
              <div class="section-title compact">
                <span>Caption</span>
                <button id="copyCaption" type="button">複製</button>
              </div>
              <textarea id="captionOutput" class="caption-output" rows="11"></textarea>
            </div>
            <div class="tab-panel" id="guardrailsPanel">
              <div class="guardrail-list">
                <p><strong>允許：</strong>時尚、髮型、泳衣、睡衣、性感但非露骨廣告風格。</p>
                <p><strong>禁止：</strong>未成年、露骨色情、非同意真人冒充、貶低或騷擾式內容。</p>
                <p><strong>建議：</strong>輸出前保留人工審稿，避免平台違規或品牌風險。</p>
              </div>
            </div>
          </div>
        </section>

        <section class="tool-area">
          <div class="section-title">
            <span>生成結果</span>
            <div class="button-row">
              <label class="import-button">
                匯入素材包
                <input id="manifestImport" type="file" accept="application/json,.json">
              </label>
              <button id="downloadTextPack" type="button">下載文字包</button>
              <button id="downloadContactSheet" type="button" disabled>下載拼圖</button>
              <button id="downloadManifest" type="button" disabled>下載素材包 JSON</button>
              <button id="clearResults" type="button">清空結果</button>
            </div>
          </div>
          <div class="result-grid" id="resultGrid"></div>
          <div class="contact-sheet-wrap" id="contactSheetWrap">
            <canvas id="contactSheetCanvas"></canvas>
          </div>
        </section>

        <section class="tool-area">
          <div class="section-title">
            <span>生成歷史</span>
            <button id="clearHistory" type="button">清空</button>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
